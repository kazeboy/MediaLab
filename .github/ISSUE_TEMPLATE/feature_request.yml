name: Feature request
description: Suggest an improvement or a new capability.
labels: ["enhancement", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        For bigger ideas (for example the desktop application), a Discussion is often a better first step. MediaLab won't add features that bypass DRM, paywalls, region blocks, private accounts or platform request signing.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
  - type: checkboxes
    id: help
    attributes:
      label: Contribution
      options:
        - label: I'd be willing to work on a pull request for this.
