# Continuous integration: backend and frontend tests on every pull request
# to main, every push to main, and on demand.
#
# No secrets, cookies or network media are used: the test suites are offline.
# Nothing is deployed, released or uploaded as an artefact.
#
# Third-party actions are pinned to full commit SHAs (the version tag is in
# the trailing comment). Dependabot (.github/dependabot.yml) proposes updates
# to these pins; to update by hand, look up the new tag's commit with
#   git ls-remote https://github.com/<owner>/<action>.git refs/tags/<tag>
# and replace both the SHA and the comment.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded pull request runs are cancelled; runs on main always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (Python 3.12, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install FFmpeg and FFprobe
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          ffmpeg -hide_banner -version | head -n 1
          ffprobe -hide_banner -version | head -n 1

      - name: Install dependencies (exact tested versions)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock

      - name: Run tests
        run: python -m pytest -ra

  frontend:
    name: Frontend (Node.js 24, typecheck, Vitest, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Vitest 5 and jsdom 31 need Node.js 22.22+ or 24.15+.
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Production build
        run: npm run build
