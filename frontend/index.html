<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <!-- "?v=2" retires the v1.6 purple icon that browsers cached under the same /favicon.svg URL. -->
    <link rel="icon" href="/favicon.ico?v=2" sizes="16x16 32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <!-- Self-hosted UI fonts (Latin subset), fetched in parallel with the app so text renders in them first time. -->
    <link rel="preload" href="/fonts/dm-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/dm-sans-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/dm-sans-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/manrope-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/manrope-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="theme-color" content="#0b0d10" />
    <script>
      // Apply the saved theme before anything renders (no flash). Dark unless the user chose light.
      // Mirrors src/lib/theme.ts (key, default, theme colours).
      (function () {
        var theme = "dark";
        try {
          var saved = localStorage.getItem("medialab.theme");
          if (saved === "light" || saved === "dark") theme = saved;
        } catch (e) {}
        document.documentElement.dataset.theme = theme;
        if (theme === "light") document.querySelector('meta[name="theme-color"]').setAttribute("content", "#f4f5f7");
      })();
    </script>
    <style>
      /* First paint, before the stylesheet arrives: the theme's page colour, never white-on-dark flashes. */
      html { background: #0b0d10; color-scheme: dark; }
      html[data-theme="light"] { background: #f4f5f7; color-scheme: light; }
    </style>
    <title>MediaLab</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
